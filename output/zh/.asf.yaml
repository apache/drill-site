# Documentation https://s.apache.org/asfyaml
github:
  homepage: https://drill.apache.org
  labels:
    - website
    - jekyll
  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
publish:
  whoami: asf-site

jekyll:
  whoami: master
  target: asf-site
